# Builds the landingpage image with Kaniko (rootless, daemonless) and pushes
# it to Docker Hub. Suited for a Kubernetes GitLab runner in the homelab.
#
# Required CI/CD variables (Settings > CI/CD > Variables) - set them "Masked":
#   DOCKERHUB_USER      Docker Hub username / namespace (e.g. "omer")
#   DOCKERHUB_TOKEN     Docker Hub access token (NOT your account password)
#
# The image is pushed as:
#   docker.io/$DOCKERHUB_USER/$IMAGE_NAME:<tag>
# where <tag> is the git tag on tag pipelines, otherwise the short commit SHA,
# plus a "latest" tag on the default branch.

stages:
  - build

variables:
  IMAGE_NAME: landingpage
  # Docker Hub registry host
  REGISTRY: docker.io

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    # Build on the default branch and on tag pipelines only
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    # Write Docker Hub credentials into the Kaniko auth config.
    # Credentials come from masked CI/CD variables - never hardcode them.
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$DOCKERHUB_USER" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
      cat > /kaniko/.docker/config.json <<EOF
      { "auths": { "https://index.docker.io/v1/": { "auth": "$AUTH" } } }
      EOF
  script:
    # Prefer the git tag as image tag; fall back to the short commit SHA.
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - export IMAGE_REF="$REGISTRY/$DOCKERHUB_USER/$IMAGE_NAME"
    - |
      # Add a "latest" tag when building the default branch.
      EXTRA_DESTINATION=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        EXTRA_DESTINATION="--destination $IMAGE_REF:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$IMAGE_REF:$IMAGE_TAG" \
        $EXTRA_DESTINATION \
        --single-snapshot \
        --cleanup
